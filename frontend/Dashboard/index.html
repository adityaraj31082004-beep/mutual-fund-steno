<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mutual Fund Steno</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h2>Mutual Fund Steno</h2>
    <a href="#">About</a>
  </header>

  <main>
    <section class="form-section">
      <h1>Tell us about yourself</h1>

      <label>Age</label>
      <input type="number" id="age" placeholder="Enter your age" />

      <label>Salary</label>
      <input type="number" id="salary" placeholder="Enter your salary" />

      <label>Goal</label>
      <select id="goal">
        <option value="">Select goal</option>
        <option value="retirement">Retirement</option>
        <option value="education">Education</option>
        <option value="wealth">Wealth Growth</option>
      </select>

      <label>Investor Type</label>
      <select id="investor-type">
        <option value="">Select investor type</option>
        <option value="beginner">Beginner</option>
        <option value="advanced">Advanced</option>
      </select>

      <button id="getRecommendations">Get Recommendations</button>
    </section>

    <section class="chat-section">
      <div class="chat-box">
        <p>💬 Would you like to learn about advanced fund strategies?</p>
        <div class="buttons">
          <button onclick="answer('yes')">Yes</button>
          <button onclick="answer('no')">No</button>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
