<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mutual Fund Steno - Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1 class="logo">Mutual Fund Steno</h1>
    <nav>
      <button class="guest-btn" onclick="visitAsGuest()">Visit as Guest</button>
    </nav>
  </header>

  <main>
    <h2>Welcome to Mutual Fund Steno</h2>

    <div class="login-box">
      <label>Email</label>
      <input type="email" id="email" placeholder="Enter your email">

      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password">

      <button class="login-btn" onclick="login()">Login</button>
      <button class="signup-btn" onclick="signup()">Sign Up</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
